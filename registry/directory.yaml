# Where to start looking, per manufacturer.
#
# This is a phone book, not permission: typing a name here does not crawl anything. The
# UI shows what it found, and you confirm you have read that site's terms before the
# brand is saved and walked. `tos_reviewed` on the saved brand file records that you did.
#
# `support` paths are entry points to walk, in order. A brand with no entry here can
# still be looked up by pasting its support URL.
