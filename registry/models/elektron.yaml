# Generations are separate models, never aliases of each other.
#
# The first run of this file proved why: "analog four" was listed as an alias of the
# MKII, so the MKI manual — and the Analog Keys — were all filed as MKII. That is the
# same fault that put a MiniBrute 2 manual under "Arturia MiniBrute" in the live library.
# Each generation gets its own entry, and only markers unique to it as aliases.
brand: elektron
models:
  - slug: digitakt
    name: Digitakt
    aliases: ["digitakt"]
    category: sampler
  - slug: digitakt-ii
    name: Digitakt II
    aliases: ["digitakt ii", "digitakt 2"]
    category: sampler
  - slug: digitone
    name: Digitone
    aliases: ["digitone"]
    category: synth
  - slug: digitone-ii
